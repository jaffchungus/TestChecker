<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Answer Checker 🧠</title>
<style>
  body {
    font-family: "Segoe UI", sans-serif;
    background: #f2f5fa;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 {
    color: #2b2b2b;
  }
  textarea {
    width: 90%;
    height: 150px;
    margin: 10px 0;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 15px;
    resize: vertical;
  }
  button {
    background: #4e8ef7;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    transition: background 0.2s;
  }
  button:hover {
    background: #2f6ae6;
  }
  #results {
    margin-top: 20px;
    width: 90%;
    background: white;
    border-radius: 10px;
    padding: 15px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }
  .correct {
    background: #e8ffe8;
    border-left: 5px solid #37d837;
    margin-bottom: 10px;
    padding: 10px;
  }
  .wrong {
    background: #ffe8e8;
    border-left: 5px solid #f44336;
    margin-bottom: 10px;
    padding: 10px;
  }
  .correction {
    margin-top: 5px;
    display: block;
    width: 100%;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #aaa;
    font-size: 14px;
  }
</style>
</head>
<body>

<h1>Answer Checker 🧠</h1>

<label><strong>Questions (or Answer Key):</strong></label>
<textarea id="keyBox" placeholder="Enter correct answers or question list here..."></textarea>

<label><strong>Your Answers:</strong></label>
<textarea id="answerBox" placeholder="Enter student answers here..."></textarea>

<button onclick="checkAnswers()">Check Answers</button>

<div id="results"></div>

<script>
function parseList(text) {
  return text
    .split(/\n+/)
    .map(line => line.trim())
    .filter(line => line)
    .map((line, i) => {
      const match = line.match(/^(\d+)[\).\-:]?\s*(.*)$/);
      return match ? { num: parseInt(match[1]), text: match[2] } : { num: null, text: line };
    });
}

function checkAnswers() {
  const keyText = document.getElementById("keyBox").value;
  const ansText = document.getElementById("answerBox").value;
  const keyList = parseList(keyText);
  const ansList = parseList(ansText);

  // Auto-number missing numbers
  keyList.forEach((item, i) => { if (item.num === null) item.num = i + 1; });
  ansList.forEach((item, i) => { if (item.num === null) item.num = i + 1; });

  // Sort by number
  keyList.sort((a, b) => a.num - b.num);
  ansList.sort((a, b) => a.num - b.num);

  const results = document.getElementById("results");
  results.innerHTML = "";

  const maxLen = Math.max(keyList.length, ansList.length);
  for (let i = 0; i < maxLen; i++) {
    const key = keyList[i] ? keyList[i].text : "";
    const ans = ansList[i] ? ansList[i].text : "";
    const num = i + 1;
    const div = document.createElement("div");

    if (key.toLowerCase().trim() === ans.toLowerCase().trim()) {
      div.className = "correct";
      div.innerHTML = `<strong>${num}.</strong> ✅ Correct - <em>${ans}</em>`;
    } else {
      div.className = "wrong";
      div.innerHTML = `<strong>${num}.</strong> ❌ Wrong<br>
                       <strong>Expected:</strong> ${key || "(none)"}<br>
                       <strong>Got:</strong> ${ans || "(none)"}<br>
                       <label>Correction:</label>
                       <input class="correction" placeholder="Type your correction...">`;
    }
    results.appendChild(div);
  }
}
</script>

</body>
</html>
